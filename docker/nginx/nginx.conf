# DinnerBears NGINX Configuration
# Handles subdomain routing and internal API proxy
# Angular static files served from /usr/share/nginx/html
# NestJS API proxied via internal Docker network

server {
    listen 80;
    server_name dinnerbears.com *.dinnerbears.com localhost *.localhost;

    # Redirect HTTP → HTTPS in production
    # Uncomment when SSL is configured:
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy /api/* to NestJS container (internal only)
    location /api/ {
        proxy_pass http://nestjs-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_cache_bypass $http_upgrade;
    }

    # Pass subdomain to API via header (city context)
    set $subdomain "";
    if ($host ~* "^([a-z]+)\.") {
        set $subdomain $1;
    }

    # Serve Angular app — HTML5 pushState routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
