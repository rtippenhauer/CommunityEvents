# DinnerBears — Docker Compose
# MySQL runs on Unraid (192.168.2.241:3306) — not managed here
# API has no public ports; nginx is the only public entry point

version: '3.9'

services:

  nginx:
    build:
      context: docker/nginx
      dockerfile: Dockerfile
    container_name: dinnerbears-nginx
    ports:
      - "8081:80"
    volumes:
      - angular-dist:/usr/share/nginx/html:ro
    depends_on:
      - nestjs-api
      - angular
    networks:
      - public
      - internal
    restart: unless-stopped

  angular:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: dinnerbears-angular
    volumes:
      - angular-dist:/output
    networks:
      - internal
    restart: unless-stopped

  nestjs-api:
    build:
      context: api
      dockerfile: Dockerfile
    container_name: dinnerbears-api
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - EMAIL_SUPPRESSION_SALT=${EMAIL_SUPPRESSION_SALT}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - GEOCODING_API_KEY=${GEOCODING_API_KEY}
      - APP_URL=${APP_URL}
    networks:
      - internal
      - public
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  angular-dist:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
