# Ephemeral MySQL for the API's e2e/integration test suite.
# Never touches the real Unraid MySQL instance used by dev/stage/prod —
# entirely separate container, throwaway data (no volume), own port.
#
# Pinned to 9.7 to match the real Unraid instance (confirmed via its own
# startup log: "MySQL Server 9.7.1").
#
# Usage: bash scripts/run-e2e-tests.sh (starts this, runs migrations, runs
# Vitest, tears down). Not meant to be started standalone in normal workflows.

# Explicit project name for the same reason docker-compose.dev.yml carries one:
# without it Compose derives the name from the invoking directory, and a
# `down --remove-orphans` can then reach into an unrelated project's containers.
name: communityevents-test

services:
  mysql-test:
    image: mysql:9.7
    # NOT dinnerbears-mysql-test. Docker container names are global, and the
    # v1 checkout at ../DinnerBears names its own test database exactly that --
    # so whichever repo started first won and the other could not create its
    # container at all. Worse, teardown here is `down --remove-orphans`, which
    # was aimed at a container docs/CODEX.md says belongs to the other checkout.
    container_name: communityevents-mysql-test
    environment:
      - MYSQL_ROOT_PASSWORD=test
      - MYSQL_DATABASE=dinnerbears_test
    # 3025 is this project's allocated port. The whole list lives in
    # ../PORTS.md -- project 02, MySQL test 3PP5 -- and a new port is taken
    # from there, never invented here. It used to be 3307, which other
    # long-lived containers on this machine also published -- and losing that
    # race does NOT fail. The container still starts, every connection to
    # 127.0.0.1:3307 reaches whoever bound it first, and the suite migrates
    # into a stranger's MySQL and passes. The only symptom is the clock: that
    # database is disk-backed where this one is tmpfs, and the same suite went
    # from 617s to 10,385s.
    ports:
      - "3025:3306"
    tmpfs:
      - /var/lib/mysql
    # --protocol=tcp is the whole point of this healthcheck, not a detail.
    # The MySQL image runs a *temporary* server to initialise the data
    # directory, and that server listens on the unix socket only. A ping over
    # the socket (`-h localhost`) therefore reports healthy while the real
    # server is still not up, `docker compose up --wait` returns too early, and
    # the first thing the suite does — prisma migrate deploy — dies with
    # "P1017: Server has closed the connection". Forcing TCP closes the race,
    # because the init server never listens on the port.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-uroot", "-ptest"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
