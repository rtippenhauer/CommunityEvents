<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="over" class="app-sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/">Home</a>
      <a mat-list-item routerLink="/events">Events</a>
      <a mat-list-item routerLink="/restaurants">Restaurants</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="app-toolbar">
      @if (isMobile()) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle navigation">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="app-title">DinnerBears</span>
      <span class="toolbar-spacer"></span>
      <mat-select class="city-selector" [value]="currentCity" aria-label="Select city">
        <mat-option value="cincinnati">Cincinnati</mat-option>
        <mat-option value="dayton">Dayton</mat-option>
      </mat-select>
    </mat-toolbar>

    <main class="app-content">
      <router-outlet />
    </main>

    <footer class="app-footer">
      <p>&copy; {{ currentYear }} DinnerBears</p>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
